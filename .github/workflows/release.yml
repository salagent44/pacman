# Push a tag like v0.2.0 and this builds static binaries and attaches them
# to a GitHub Release, so any machine can fetch one with curl.
name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./... && go test ./...
      - name: build
        run: |
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" -o pacman-linux-$arch .
          done
          sha256sum pacman-linux-* > SHA256SUMS
      - name: release
        env:
          GH_TOKEN: ${{ github.token }}
        # create the release, or refresh the assets if it already exists
        run: |
          gh release create "$GITHUB_REF_NAME" pacman-linux-* SHA256SUMS --title "$GITHUB_REF_NAME" --generate-notes \
            || gh release upload "$GITHUB_REF_NAME" pacman-linux-* SHA256SUMS --clobber
